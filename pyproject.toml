[project]
name = "practical-llm-notes"
version = "0.1.0"
description = "这是一个配合我 LLM / 大模型视频使用的实战仓库。项目参考 notes-on-llms，用「文档 + 实际代码」的方式，把视频中讲到的大模型概念真正跑起来，适合视频观众课后学习和复盘。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ============================================================================
    # 核心 LangChain 库
    # ============================================================================
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    # ============================================================================
    # LLM 提供商
    # ============================================================================
    # Qwen (通义千问) - 阿里云 DashScope
    "dashscope>=1.25.7",
    # OpenAI
    "langchain-openai>=0.2.0",
    # Anthropic Claude
    "langchain-anthropic>=0.2.0",
    # ============================================================================
    # 向量存储和嵌入
    # ============================================================================
    # Chroma 向量数据库
    "langchain-chroma>=0.1.0",
    "chromadb>=0.4.0",
    # ============================================================================
    # 文档处理
    # ============================================================================
    # 文本分割
    "langchain-text-splitters>=0.3.0",
    # PDF 文档支持
    "pypdf>=3.17.0",
    # 网页加载支持
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # ============================================================================
    # 语音 Agent 相关
    # ============================================================================
    # STT (语音转文本)
    "assemblyai>=0.30.0",
    # WebSocket 通信
    "websockets>=12.0",
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    # 异步文件操作
    "aiofiles>=23.0.0",
    # 数据验证
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # ============================================================================
    # 工具和实用程序
    # ============================================================================
    # 环境变量管理
    "python-dotenv>=1.0.0",
    # HTTP 请求
    "requests>=2.31.0",
    # LangSmith 追踪和监控
    "langsmith>=0.1.0",
    # ============================================================================
    # 开发和测试工具
    # ============================================================================
    # 测试框架
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # 代码格式化和 Linter
    "black>=24.0.0",
    "ruff>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0.1",
]
